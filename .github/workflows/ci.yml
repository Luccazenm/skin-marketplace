name: CI

# Runs on every branch, not only the main one: the value is in catching
# the breakage before it becomes a merge, not after.
on:
  push:
  pull_request:

jobs:
  verify:
    name: typecheck, lint, tests and build
    runs-on: ubuntu-latest

    # Disposable, created from scratch on every run — that is what makes
    # CI catch what the development machine hides: an uncommitted
    # migration, a dependency installed locally only, data that "was
    # always there".
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # The name matters: the suite derives the test database from
          # this one by appending "_test", and needs to connect to this
          # one in order to create that one.
          POSTGRES_DB: skin_marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skin_marketplace
      REDIS_URL: redis://localhost:6379
      # It only has to pass the format validation: nothing here signs a
      # real session or is used outside this job.
      JWT_SECRET: ci-secret-with-no-real-value-only-to-pass-validation
      CORS_ORIGIN: http://localhost:5173
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # --frozen-lockfile: if the lockfile does not match the
      # package.json files, the run fails instead of resolving versions
      # different from yours.
      - run: pnpm install --frozen-lockfile

      # Prisma's preinstall deletes the generated client — see CLAUDE.md.
      - run: pnpm --filter backend exec prisma generate

      - run: pnpm typecheck

      # `--no-fix` because in CI the lint must fail, not fix: a file
      # corrected here never makes it back to your computer.
      - run: pnpm --filter backend exec eslint "{src,test}/**/*.ts" --no-fix

      # The globalSetup creates skin_marketplace_test, applies the
      # migrations and runs the seed. Nothing else needs preparing here.
      - run: pnpm test

      - run: pnpm build
